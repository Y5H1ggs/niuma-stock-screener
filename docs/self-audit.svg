<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 470" width="1000" height="470" role="img"
     aria-label="三重门：结论在出口前、写作中、事后各接受一次检验">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FBFCFD"/>
      <stop offset="100%" stop-color="#F2F5F8"/>
    </linearGradient>
    <linearGradient id="g1" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1B4568"/>
      <stop offset="100%" stop-color="#12304F"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#C9A961"/>
      <stop offset="100%" stop-color="#A9843F"/>
    </linearGradient>
  </defs>

  <rect width="1000" height="470" fill="url(#bg)"/>
  <rect x="0" y="0" width="1000" height="3" fill="url(#gold)"/>

  <text x="40" y="42" font-family="-apple-system,'Segoe UI','Microsoft YaHei',sans-serif"
        font-size="19" font-weight="700" fill="#12304F">三重门：一个结论要过三道检验才能出口</text>
  <text x="40" y="66" font-family="-apple-system,'Segoe UI','Microsoft YaHei',sans-serif"
        font-size="12" fill="#6B7F92">大部分选股工具只在「生成」这一段；这里在「生成前、生成时、生成后」各设一道闸</text>

  <!-- 门 1 -->
  <g>
    <rect x="40" y="92" width="290" height="250" rx="10" fill="#FFFFFF" stroke="#D8E0E8"/>
    <rect x="40" y="92" width="290" height="4" rx="2" fill="url(#gold)"/>
    <circle cx="72" cy="126" r="15" fill="#12304F"/>
    <text x="72" y="131" text-anchor="middle" font-family="-apple-system,sans-serif"
          font-size="13" font-weight="700" fill="#FFFFFF">1</text>
    <text x="98" y="131" font-family="-apple-system,'Segoe UI','Microsoft YaHei',sans-serif"
          font-size="14" font-weight="700" fill="#12304F">写作中：踩坑库</text>
    <text x="56" y="158" font-family="-apple-system,'Segoe UI','Microsoft YaHei',sans-serif"
          font-size="11.5" fill="#6B7F92">125 条真实事故，按症状索引</text>

    <line x1="56" y1="174" x2="314" y2="174" stroke="#E8EDF2"/>

    <text x="56" y="196" font-family="-apple-system,'Segoe UI','Microsoft YaHei',sans-serif"
          font-size="11.5" fill="#2C4A66">能抓到</text>
    <text x="56" y="216" font-family="-apple-system,'Segoe UI','Microsoft YaHei',sans-serif"
          font-size="11" fill="#3D566E">· 字段量纲差 100 倍</text>
    <text x="56" y="234" font-family="-apple-system,'Segoe UI','Microsoft YaHei',sans-serif"
          font-size="11" fill="#3D566E">· 占位符被读成 0</text>
    <text x="56" y="252" font-family="-apple-system,'Segoe UI','Microsoft YaHei',sans-serif"
          font-size="11" fill="#3D566E">· 累计值被当成增量相加</text>
    <text x="56" y="270" font-family="-apple-system,'Segoe UI','Microsoft YaHei',sans-serif"
          font-size="11" fill="#3D566E">· 板块代码凭记忆写错</text>

    <text x="56" y="298" font-family="-apple-system,'Segoe UI','Microsoft YaHei',sans-serif"
          font-size="11.5" fill="#B0655C">抓不到</text>
    <text x="56" y="318" font-family="-apple-system,'Segoe UI','Microsoft YaHei',sans-serif"
          font-size="11" fill="#8A625C">· 从未犯过的新错</text>
  </g>

  <!-- 门 2 -->
  <g>
    <rect x="355" y="92" width="290" height="250" rx="10" fill="#FFFFFF" stroke="#D8E0E8"/>
    <rect x="355" y="92" width="290" height="4" rx="2" fill="url(#gold)"/>
    <circle cx="387" cy="126" r="15" fill="#12304F"/>
    <text x="387" y="131" text-anchor="middle" font-family="-apple-system,sans-serif"
          font-size="13" font-weight="700" fill="#FFFFFF">2</text>
    <text x="413" y="131" font-family="-apple-system,'Segoe UI','Microsoft YaHei',sans-serif"
          font-size="14" font-weight="700" fill="#12304F">出口前：七问</text>
    <text x="371" y="158" font-family="-apple-system,'Segoe UI','Microsoft YaHei',sans-serif"
          font-size="11.5" fill="#6B7F92">交付前强制自检，答不上不许发</text>

    <line x1="371" y1="174" x2="629" y2="174" stroke="#E8EDF2"/>

    <text x="371" y="196" font-family="-apple-system,'Segoe UI','Microsoft YaHei',sans-serif"
          font-size="11.5" fill="#2C4A66">七个问句中的四个</text>
    <text x="371" y="216" font-family="-apple-system,'Segoe UI','Microsoft YaHei',sans-serif"
          font-size="11" fill="#3D566E">· 这个数是算的还是拍的</text>
    <text x="371" y="234" font-family="-apple-system,'Segoe UI','Microsoft YaHei',sans-serif"
          font-size="11" fill="#3D566E">· 取不到数据时走通过还是拦截</text>
    <text x="371" y="252" font-family="-apple-system,'Segoe UI','Microsoft YaHei',sans-serif"
          font-size="11" fill="#3D566E">· 这几个理由是独立的还是同一份</text>
    <text x="371" y="270" font-family="-apple-system,'Segoe UI','Microsoft YaHei',sans-serif"
          font-size="11" fill="#3D566E">· 每个百分比的分子分母是哪天</text>

    <text x="371" y="298" font-family="-apple-system,'Segoe UI','Microsoft YaHei',sans-serif"
          font-size="11.5" fill="#B0655C">抓不到</text>
    <text x="371" y="318" font-family="-apple-system,'Segoe UI','Microsoft YaHei',sans-serif"
          font-size="11" fill="#8A625C">· 问句本身没想到的角度</text>
  </g>

  <!-- 门 3 -->
  <g>
    <rect x="670" y="92" width="290" height="250" rx="10" fill="#FFFFFF" stroke="#D8E0E8"/>
    <rect x="670" y="92" width="290" height="4" rx="2" fill="url(#gold)"/>
    <circle cx="702" cy="126" r="15" fill="#12304F"/>
    <text x="702" y="131" text-anchor="middle" font-family="-apple-system,sans-serif"
          font-size="13" font-weight="700" fill="#FFFFFF">3</text>
    <text x="728" y="131" font-family="-apple-system,'Segoe UI','Microsoft YaHei',sans-serif"
          font-size="14" font-weight="700" fill="#12304F">事后：预测结算</text>
    <text x="686" y="158" font-family="-apple-system,'Segoe UI','Microsoft YaHei',sans-serif"
          font-size="11.5" fill="#6B7F92">每个概率都落台账，到期自动对账</text>

    <line x1="686" y1="174" x2="944" y2="174" stroke="#E8EDF2"/>

    <text x="686" y="196" font-family="-apple-system,'Segoe UI','Microsoft YaHei',sans-serif"
          font-size="11.5" fill="#2C4A66">能抓到</text>
    <text x="686" y="216" font-family="-apple-system,'Segoe UI','Microsoft YaHei',sans-serif"
          font-size="11" fill="#3D566E">· 系统性乐观偏差</text>
    <text x="686" y="234" font-family="-apple-system,'Segoe UI','Microsoft YaHei',sans-serif"
          font-size="11" fill="#3D566E">· Brier 是否输给常数基线</text>
    <text x="686" y="252" font-family="-apple-system,'Segoe UI','Microsoft YaHei',sans-serif"
          font-size="11" fill="#3D566E">· 哪类事件长期被高估</text>

    <text x="686" y="298" font-family="-apple-system,'Segoe UI','Microsoft YaHei',sans-serif"
          font-size="11.5" fill="#B0655C">抓不到</text>
    <text x="686" y="318" font-family="-apple-system,'Segoe UI','Microsoft YaHei',sans-serif"
          font-size="11" fill="#8A625C">· 样本不足 30 笔时的一切</text>
  </g>

  <!-- 底部结论条 -->
  <g>
    <rect x="40" y="360" width="920" height="82" rx="10" fill="url(#g1)"/>
    <text x="64" y="390" font-family="-apple-system,'Segoe UI','Microsoft YaHei',sans-serif"
          font-size="12.5" fill="#C9A961" font-weight="700">为什么要三道</text>
    <text x="64" y="414" font-family="-apple-system,'Segoe UI','Microsoft YaHei',sans-serif"
          font-size="12" fill="#E3EBF2">单独任何一道都会被绕过去：踩坑库管不了新错，七问管不了自己没想到的角度，结算管不了样本不足。</text>
    <text x="64" y="432" font-family="-apple-system,'Segoe UI','Microsoft YaHei',sans-serif"
          font-size="12" fill="#E3EBF2">三道叠起来的价值不在「不出错」，而在「错了会被记录下来，且下次开工之前就能看到」。</text>
  </g>
</svg>
