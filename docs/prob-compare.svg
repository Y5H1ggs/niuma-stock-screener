<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 480" width="1000" height="480" role="img" aria-label="条件化前后次日与多日收涨概率对比">
  <defs>
    <linearGradient id="g-ind" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#93A9BC"/>
      <stop offset="1" stop-color="#6E8699"/>
    </linearGradient>
    <linearGradient id="g-bk" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#D9BC7A"/>
      <stop offset="1" stop-color="#A9843F"/>
    </linearGradient>
    <linearGradient id="hd" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#A9843F"/>
      <stop offset="0.5" stop-color="#E2C98F"/>
      <stop offset="1" stop-color="#A9843F"/>
    </linearGradient>
  </defs>

  <rect width="1000" height="480" fill="#FFFFFF"/>

  <text x="48" y="46" fill="#12304F" font-size="21" font-weight="700"
        font-family="-apple-system,'Segoe UI','Microsoft YaHei',sans-serif">接入板块 β 前后，结论变了</text>
  <text x="48" y="72" fill="#6B7F92" font-size="12.5"
        font-family="-apple-system,'Segoe UI','Microsoft YaHei',sans-serif">同一只票 · 同一段历史 · 两种条件筛出的次日与多日收涨概率（Y 轴从 0 起，不放大差异）</text>
  <rect x="48" y="86" width="904" height="2" fill="url(#hd)" opacity="0.4"/>

  <!--
    坐标系（固定）：
      0%  → y=410      60% → y=179
      满量程 0~70%，1% = (410-140)/70 = 3.857px
  -->
  <g stroke="#E6EDF3" stroke-width="1" font-family="-apple-system,'Segoe UI','Microsoft YaHei',sans-serif">
    <line x1="150" y1="140" x2="640" y2="140"/>
    <line x1="150" y1="179" x2="640" y2="179"/>
    <line x1="150" y1="256" x2="640" y2="256"/>
    <line x1="150" y1="333" x2="640" y2="333"/>
    <line x1="150" y1="410" x2="640" y2="410" stroke="#C6D3DE"/>
    <text x="132" y="144" fill="#8FA1B2" font-size="11" text-anchor="end">70%</text>
    <text x="132" y="183" fill="#8FA1B2" font-size="11" text-anchor="end">60%</text>
    <text x="132" y="260" fill="#8FA1B2" font-size="11" text-anchor="end">40%</text>
    <text x="132" y="337" fill="#8FA1B2" font-size="11" text-anchor="end">20%</text>
    <text x="132" y="414" fill="#8FA1B2" font-size="11" text-anchor="end">0%</text>
  </g>

  <!-- 50% 随机基准线：y = 410 - 50*3.857 = 217 -->
  <line x1="150" y1="217" x2="640" y2="217" stroke="#C0392B" stroke-width="1.4" stroke-dasharray="6 4" opacity="0.55"/>
  <text x="552" y="211" fill="#C0392B" font-size="10.5" opacity="0.9" text-anchor="middle"
        font-family="-apple-system,'Segoe UI','Microsoft YaHei',sans-serif">50% 随机基准</text>

  <!--
    柱：底一律 y=410，高 = pct*3.857
      48.6% → h=187 y=222 | 55.0% → h=212 y=198
      62.9% → h=243 y=167 | 60.0% → h=231 y=179
      57.1% → h=220 y=190 | 50.0% → h=193 y=217
  -->
  <g>
    <!-- 1 日 -->
    <rect x="196" y="222" width="52" height="188" rx="3" fill="url(#g-ind)"/>
    <rect x="256" y="198" width="52" height="212" rx="3" fill="url(#g-bk)"/>
    <text x="222" y="214" fill="#4F6779" font-size="13" font-weight="700" text-anchor="middle"
          font-family="-apple-system,'Segoe UI','Microsoft YaHei',sans-serif">48.6</text>
    <text x="282" y="190" fill="#8A6A2F" font-size="13" font-weight="700" text-anchor="middle"
          font-family="-apple-system,'Segoe UI','Microsoft YaHei',sans-serif">55.0</text>

    <!-- 3 日 -->
    <rect x="396" y="167" width="52" height="243" rx="3" fill="url(#g-ind)"/>
    <rect x="456" y="179" width="52" height="231" rx="3" fill="url(#g-bk)"/>
    <text x="422" y="159" fill="#4F6779" font-size="13" font-weight="700" text-anchor="middle"
          font-family="-apple-system,'Segoe UI','Microsoft YaHei',sans-serif">62.9</text>
    <text x="482" y="171" fill="#8A6A2F" font-size="13" font-weight="700" text-anchor="middle"
          font-family="-apple-system,'Segoe UI','Microsoft YaHei',sans-serif">60.0</text>

    <!-- 5 日 -->
    <rect x="596" y="190" width="52" height="220" rx="3" fill="url(#g-ind)"/>
    <rect x="656" y="217" width="52" height="193" rx="3" fill="url(#g-bk)"/>
    <text x="622" y="182" fill="#4F6779" font-size="13" font-weight="700" text-anchor="middle"
          font-family="-apple-system,'Segoe UI','Microsoft YaHei',sans-serif">57.1</text>
    <text x="682" y="209" fill="#8A6A2F" font-size="13" font-weight="700" text-anchor="middle"
          font-family="-apple-system,'Segoe UI','Microsoft YaHei',sans-serif">50.0</text>
  </g>

  <!-- X 轴标签 -->
  <g fill="#5B7285" font-size="12.5" text-anchor="middle"
     font-family="-apple-system,'Segoe UI','Microsoft YaHei',sans-serif">
    <text x="252" y="434">持有 1 日</text>
    <text x="452" y="434">持有 3 日</text>
    <text x="652" y="434">持有 5 日</text>
  </g>

  <!-- 图例 -->
  <g font-family="-apple-system,'Segoe UI','Microsoft YaHei',sans-serif" font-size="11.5">
    <rect x="152" y="104" width="12" height="12" rx="2" fill="url(#g-ind)"/>
    <text x="170" y="114" fill="#5B7285">个股条件（跌≥2.5% + 缩量，N=35）</text>
    <rect x="392" y="104" width="12" height="12" rx="2" fill="url(#g-bk)"/>
    <text x="410" y="114" fill="#8A6A2F">板块条件（板块单日跌≥3%，N=20）</text>
  </g>

  <!-- 分隔与右侧要点 -->
  <line x1="730" y1="130" x2="730" y2="410" stroke="#E6EDF3"/>
  <g font-family="-apple-system,'Segoe UI','Microsoft YaHei',sans-serif">
    <text x="754" y="146" fill="#A9843F" font-size="11.5" font-weight="700" letter-spacing="1.2">三个反直觉的发现</text>

    <circle cx="760" cy="176" r="3" fill="#C0392B"/>
    <text x="774" y="180" fill="#28425A" font-size="11.5">板块大跌后，个股次日收涨反而更高</text>
    <text x="774" y="198" fill="#6B7F92" font-size="10.5">55.0% vs 48.6% ——「跌了继续跌」不成立</text>

    <circle cx="760" cy="230" r="3" fill="#C0392B"/>
    <text x="774" y="234" fill="#28425A" font-size="11.5">但波动大得多，概率高 ≠ 好做</text>
    <text x="774" y="252" fill="#6B7F92" font-size="10.5">次日标差 5.10% vs 2.72%，3 日双峰</text>

    <circle cx="760" cy="284" r="3" fill="#C0392B"/>
    <text x="774" y="288" fill="#28425A" font-size="11.5">持有期比方向更重要</text>
    <text x="774" y="306" fill="#6B7F92" font-size="10.5">次日 48.6% 近随机，3 日 62.9% 才有 edge</text>
    <text x="774" y="324" fill="#6B7F92" font-size="10.5">只看次日会误判「这形态没用」</text>

    <rect x="754" y="348" width="200" height="60" rx="5" fill="#F7F9FB" stroke="#D8E2EA"/>
    <text x="768" y="368" fill="#12304F" font-size="10.5" font-weight="700">为什么以前算不出？</text>
    <text x="768" y="385" fill="#6B7F92" font-size="10">概率模型只读个股 K 线，看不见板块；</text>
    <text x="768" y="400" fill="#6B7F92" font-size="10">而当天跌幅 100% 由板块解释（α≈0）。</text>
  </g>

  <rect x="0" y="477" width="1000" height="3" fill="url(#hd)" opacity="0.5"/>
</svg>
